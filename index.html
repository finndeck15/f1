<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McLaren MP4/4 | F1 in Schools CAD Viewer</title>
    <!-- Import Google model-viewer script -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root {
            --mclaren-red: #e60000;
            --bg-dark: #121212;
            --panel-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark);
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Title Bar */
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            color: var(--mclaren-red);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 3D Model Canvas Container */
        .viewer-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* Custom Loading Overlay */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .spinner-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .progress-bar-container {
            width: 280px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--mclaren-red);
            transition: width 0.2s ease;
        }

        .progress-text {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #888888;
            font-variant-numeric: tabular-nums;
        }

        /* Technical Spec Badges Bottom Overlay */
        .specs-overlay {
            position: absolute;
            bottom: 25px;
            left: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .badge {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 6px;
        }

        .badge-label {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>McLaren <span>MP4/4</span></h1>
        <div class="subtitle">F1 in Schools CAD Model Viewer</div>
    </header>

    <!-- 3D Model Viewer & Loading Screen -->
    <div class="viewer-container">
        <!-- Loading Screen Widget -->
        <div id="loading-screen" class="loading-screen">
            <div class="spinner-title">Loading 3D CAD Model</div>
            <div class="progress-bar-container">
                <div id="progress-bar-fill" class="progress-bar-fill"></div>
            </div>
            <div id="progress-text" class="progress-text">0%</div>
        </div>

        <!-- Interactive 3D Canvas -->
        <model-viewer 
            id="car-viewer"
            src="car-model.glb" 
            alt="McLaren MP4/4 3D CAD Model" 
            auto-rotate 
            camera-controls 
            shadow-intensity="1.5"
            exposure="1.0"
            interaction-prompt="auto">
        </model-viewer>
    </div>

    <!-- Bottom Specs Overlay -->
    <div class="specs-overlay">
        <div class="badge">
            <div class="badge-label">Livery Target</div>
            <div class="badge-value">1988 Rocket Red & White</div>
        </div>
        <div class="badge">
            <div class="badge-label">Car Number</div>
            <div class="badge-value">#12</div>
        </div>
        <div class="badge">
            <div class="badge-label">Mesh Optimization</div>
            <div class="badge-value">Sub-25MB Meshopt</div>
        </div>
    </div>

    <!-- Script to Handle Download Progress Bar -->
    <script>
        const viewer = document.getElementById('car-viewer');
        const loadingScreen = document.getElementById('loading-screen');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const progressText = document.getElementById('progress-text');

        // Track download percentage
        viewer.addEventListener('progress', (event) => {
            const percentage = Math.round(event.detail.totalProgress * 100);
            progressBarFill.style.width = `${percentage}%`;
            progressText.innerText = `${percentage}% loaded`;
        });

        // Hide loading screen once fully rendered
        viewer.addEventListener('load', () => {
            loadingScreen.classList.add('hidden');
        });
    </script>
</body>
</html>
