<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McLaren MP4/4 3D Viewer</title>
    <!-- Import Google model-viewer script -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="car-model.glb" 
        alt="McLaren MP4/4 F1 Model" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1.5">
    </model-viewer>

</body>
</html>
